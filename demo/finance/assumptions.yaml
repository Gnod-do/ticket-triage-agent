# Financial model inputs (spec §6). Only `managers: 40` comes from the case PDF (p.4).
# Every other value is an assumption to be replaced by measurements (Q5 metrics document).
# Macro values (r, g) must be checked against official sources when writing the submission.
#
# B1 (avoided repeat tickets) = clusters_per_year * accept_rate * weekly_rate * lead_gain_weeks
#                             + extra_fixed_clusters * weekly_rate * remaining_weeks
#      value = avoided * aht_min / 60 * hour_cost_rub
# B2 (manual aggregation no longer needed) = managers * h_week * 48 * hour_cost_rub
# max_capex = sum_{t=1..3} (B1 + B2) * (1+g)^(t-1) / (1+r)^t

macro:
  key_rate:
    value: 0.14
    as_of: "2026-10-23"
    forecast_avg: {"2027": "12.5-13.5%", "2028": "9.0-10.0%"}
    source: "Банк России, пресс-релиз 23.10.2026, https://www.cbr.ru/press/keypr/"
  wage_growth:
    value: 0.07
    range: "6.8-7.1% в год, 2027-2029"
    source: "Минэкономразвития, прогноз СЭР на 2027-2029 (https://www.consultant.ru/law/hotdocs/95751.html)"
  it_risk_premium: 0.05
# r = expected key rate over the horizon + IT project risk premium:
#   pessimistic 14% held + 6 pp = 20%; base ~13% + 5 pp = 18%; optimistic ~10% + 5 pp = 15%
# g = nominal wage indexation: 5% / 7% (MinEcon) / 8%

scenarios:
  pessimistic:
    managers: 40
    h_week: 0.5
    hour_cost_rub: 700
    aht_min: 8
    clusters_per_year: 40
    accept_rate: 0.3
    weekly_rate: 4
    lead_gain_weeks: 2
    extra_fixed_clusters: 5
    remaining_weeks: 13
    r: 0.20
    g: 0.05
  base:
    managers: 40
    h_week: 2
    hour_cost_rub: 900
    aht_min: 12
    clusters_per_year: 80
    accept_rate: 0.5
    weekly_rate: 8
    lead_gain_weeks: 6
    extra_fixed_clusters: 20
    remaining_weeks: 26
    r: 0.18
    g: 0.07
  optimistic:
    managers: 40
    h_week: 4
    hour_cost_rub: 1100
    aht_min: 15
    clusters_per_year: 120
    accept_rate: 0.7
    weekly_rate: 10
    lead_gain_weeks: 10
    extra_fixed_clusters: 30
    remaining_weeks: 26
    r: 0.15
    g: 0.08

deposit_rate_for_comparison: 0.13  # ~ средняя ключевая ставка 2027 по прогнозу ЦБ
