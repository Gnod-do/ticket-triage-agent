    - {product_id: webneft, type: service_request, text: "Пришлите нам заверенную копию договора поставки."}
    - {product_id: webneft, type: service_request, text: "Поменяйте адрес доставки в заявке на склад в Ишиме."}
    - {product_id: webneft, type: service_request, text: "Отзовите доверенность на сотрудника, он уволился."}
    - {product_id: webneft, type: service_request, text: "Зарезервируйте за нами 20 тонн дизтоплива на следующий месяц."}
    - {product_id: webneft, type: service_request, text: "Сделайте сверку взаиморасчётов за квартал и направьте акт."}
    - {product_id: fuel_cards, type: service_request, text: "Закройте договор по топливным картам с первого числа."}
    - {product_id: fuel_cards, type: service_request, text: "Привяжите карту {card} к другому автомобилю."}
    - {product_id: fuel_cards, type: service_request, text: "Смените email для рассылки отчётов на новый адрес бухгалтерии."}
