[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbagent"
version = "0.1.0"
description = "Support-to-product feedback agent demo (Intelligence Cup 2026, Gazprom Neft case)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["demo"]

[tool.pytest.ini_options]
testpaths = ["demo/tests"]
pythonpath = ["demo"]
